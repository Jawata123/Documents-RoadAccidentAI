[build-system]
requires = [
    "setuptools>=75.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "road-accident-detection"
version = "0.1.0"
description = "Production-quality real-time road accident detection framework using the latest stable Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "RoadAccidentAI Project" }
]

keywords = [
    "computer-vision",
    "yolo",
    "ultralytics",
    "road-accident",
    "accident-detection",
    "traffic-analysis",
    "opencv",
    "deep-learning",
    "object-detection",
    "video-processing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "opencv-python>=4.11.0",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "PyYAML>=6.0.2",
    "rich>=14.0.0",
    "typing_extensions>=4.14.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.17.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
    "isort>=6.0.0",
    "pre-commit>=4.2.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

onnx = [
    "onnx>=1.18.0",
    "onnxruntime>=1.22.0",
]

tensorrt = [
    "tensorrt",
]

[project.urls]
Homepage = "https://github.com/yourusername/RoadAccidentAI"
Repository = "https://github.com/yourusername/RoadAccidentAI"
Documentation = "https://github.com/yourusername/RoadAccidentAI"
Issues = "https://github.com/yourusername/RoadAccidentAI/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

include = [
    "road_accident_detection*",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
]

ignore = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=road_accident_detection",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = [
    "road_accident_detection",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true

check_untyped_defs = true
no_implicit_optional = true
pretty = true

namespace_packages = true
explicit_package_bases = true

plugins = [
    "pydantic.mypy",
]